<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mohamed Amagar</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a href="home.html" class="logo-container">
                <span class="logo-text">My Portfolio</span>
            </a>

            <button class="burger" id="burger-menu" type="button" aria-label="Toggle Navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links" id="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-wrapper" aria-labelledby="contact-title">
            <h2 id="contact-title">Contact Me</h2>
            <p class="contact-intro">Send me a message and I will get back to you soon.</p>

            <!-- FormSubmit securely forwards submissions to the configured Gmail address. -->
            <form id="contact-form" action="https://formsubmit.co/amagarmohamed@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New portfolio contact request">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_next" value="https://amagar206.github.io/mohmed-amagar-portfolio/contact.html?sent=1">
                <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" class="honey-field">

                <label for="contact-name">Your Name</label>
                <input id="contact-name" type="text" name="name" placeholder="Your Name" autocomplete="name" required>

                <label for="contact-email">Your Email</label>
                <input id="contact-email" type="email" name="email" placeholder="Your Email" autocomplete="email" required>

                <label for="contact-message">Your Message</label>
                <textarea id="contact-message" name="message" placeholder="Your Message" required></textarea>

                <button type="submit" class="submit-btn">Send Message</button>
                <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AMAGAR MOHMED. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
