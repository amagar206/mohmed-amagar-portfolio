<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Metaverse – Mohamed Amagar</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="home.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #050510 100%);
            overflow: hidden;
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #050510 100%);
            backdrop-filter: blur(10px);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="splash-container">
            <button id="enter-btn" class="enter-button" type="button" aria-label="Enter the Metaverse">
                <span class="btn-text">Enter the Metaverse</span>
                <span class="btn-glow" aria-hidden="true"></span>
                <span class="btn-ripple" aria-hidden="true"></span>
            </button>
            <p class="splash-sub">⚡ Network &amp; Systems Specialist</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
