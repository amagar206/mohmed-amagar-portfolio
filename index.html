<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Metaverse – Mohamed Amagar</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="home.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Override body for splash-only page */
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #050510 100%);
            overflow: hidden; /* No scrollbar */
        }
        /* Hide header, footer, main content – they don't exist here */
        header, main, footer { display: none; }
        /* Ensure splash takes full viewport */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex !important;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #050510 100%);
            backdrop-filter: blur(10px);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        /* The button is already centered via flex */
    </style>
</head>
<body>

    <!-- ===== SPLASH SCREEN – 4D ENTRY BUTTON ===== -->
    <div id="splash-screen">
        <div class="splash-container">
            <button id="enter-btn" class="enter-button">
                <span class="btn-text">Enter the Metaverse</span>
                <span class="btn-glow"></span>
                <span class="btn-ripple"></span>
            </button>
            <p class="splash-sub">⚡ Network & Systems Specialist</p>
        </div>
    </div>

    <!-- No other content on this page – it's short and clean -->

    <script src="script.js"></script>
</body>
</html>
